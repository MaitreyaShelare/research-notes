# Inference / open-set configuration, shared across datasets.

inference:
  # Conservative defaults; calibrate per-group thresholds on the val set
  # with scripts/run_evaluation.py --calibrate (see calibrator.py).
  default_similarity_threshold: 0.60
  default_margin_threshold: 0.05

  calibration_percentile: 5   # percentile of correct-retrieval similarities/margins

  # Populated automatically by fgvc.retrieval.calibrator after calibration.
  # Keyed by taxonomy `group`.
  group_thresholds: {}


  # Weak taxonomy-aware confidence adjustment (was `ontology:`).
  taxonomy:
    enabled: true
    unknown_pair_confidence_penalty: 0.05
    warn_implausible_pairs: true

  output_top_k: 5
