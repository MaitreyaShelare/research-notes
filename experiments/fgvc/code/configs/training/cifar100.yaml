# Overrides on top of configs/training/default.yaml, applied only when
# --dataset cifar100.
training:
  experiment_name: cifar100_dinov2_ce_v1
  epochs: 20
  batch_size: 64
  input:
    image_size: 224   # CIFAR-100 images are natively 32x32; 

  wandb:
    group: cifar100
    tags: [dinov2, ce, cifar100]
