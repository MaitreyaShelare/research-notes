# Base training hyper-parameters, shared by every dataset. A dataset gets
# its own configs/training/<dataset>.yaml only for the values that need
# to differ (epochs, batch_size, image_size, wandb group/tags, ...) — see
# configs/training/cub200.yaml for an example. Both files are merged by
# fgvc.utils.config.load_experiment_config(dataset=...).

training:
  experiment_name: default_run
  seed: 42

  backbone:
    model_name: vit_base_patch14_dinov2.lvd142m   # any timm model name
    pretrained: true
    freeze_backbone: false
    embedding_dim: 768

  input:
    image_size: 224
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

  augmentation:
    train:
      random_resized_crop: true
      horizontal_flip: true
      color_jitter:
        brightness: 0.2
        contrast: 0.2
        saturation: 0.2
        hue: 0.05
      rotation_degrees: 15
    val:
      center_crop: true

  optimizer:
    name: adamw
    lr: 1.0e-4
    weight_decay: 1.0e-2
    backbone_lr_multiplier: 0.1

  scheduler:
    name: cosine
    warmup_epochs: 3
    min_lr: 1.0e-6

  loss:
    ce_weight: 1.0
    supcon_weight: 0.0
    supcon_temperature: 0.07
    label_smoothing: 0.0

  epochs: 30
  batch_size: 64
  gradient_accumulation_steps: 1
  mixed_precision: true
  gradient_clip_norm: 1.0

  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.001

  dataloader:
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4

  ddp:
    enabled: true   # informational only — actual process/GPU count is set
                     # by `torchrun --nproc_per_node=N`, not read from here
    backend: nccl

  checkpointing:
    save_every_n_epochs: 5
    monitor: val/top1_acc
    mode: max

  wandb:
    enabled: true
    project: fgvc
    tags: []
    log_every_n_steps: 50
