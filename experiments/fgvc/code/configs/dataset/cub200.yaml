# Caltech-UCSD Birds-200-2011, official local distribution.
# See configs/dataset/cub200_hf.yaml for the Hugging Face Hub alternative
# (same standardised output, different data source).

dataset:
  name: cub200
  version: "1.0"

  adapter: cub200
  adapter_kwargs:
    #root: data/raw/cub200        # extraction target; auto-downloaded if empty
    root: ~/research/datasets/CUB_200_2011
    source: local
    download: false

  # sftp://10.107.35.100/home/maitreya/research/datasets/CUB_200_2011/CUB_200_2011
  processed_root: data/processed/cub200
  splits_dir: data/processed/cub200/splits

  valid_extensions: [".jpg", ".jpeg", ".png"]
  seed: 42

  # test is frozen from the official train_test_split.txt; these ratios
  # only decide the train/val split within the official "train" pool.
  split_ratios:
    train: 0.85
    val: 0.15
    test: 0.15   # unused (see respect_official_split below)
  respect_official_split: true

  taxonomy:
    compose_label_id: ["label"]   # flat species-level taxonomy, no group axis
