# CIFAR-100, loaded via the `datasets` library and materialized once to
# disk (see fgvc.data.hf_classification — generic, not CIFAR-specific).
# `group_field: coarse_label` gives every image a superclass label
# (20 groups) purely as descriptive/gating metadata; the classifier still
# trains on the 100 fine labels (see taxonomy.compose_label_id below).

dataset:
  name: cifar100
  version: "1.0"

  adapter: hf_classification
  adapter_kwargs:
    # hf_name: cifar100
    hf_name: uoft-cs/cifar100
    materialize_dir: data/raw/cifar100_materialized
    image_field: img
    label_field: fine_label
    group_field: coarse_label
    split_map:
      train: train
      test: test
    image_format: png

  processed_root: data/processed/cifar100
  splits_dir: data/processed/cifar100/splits

  valid_extensions: [".png", ".jpg", ".jpeg"]
  seed: 42

  split_ratios:
    train: 0.9
    val: 0.1
    test: 0.1   # unused (see respect_official_split below)
  respect_official_split: true

  taxonomy:
    compose_label_id: ["label"]   # classify on the 100 fine labels; group is descriptive only
